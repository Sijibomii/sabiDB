[package]
name = "sabi-server"
version = "0.1.0"
edition = "2024"

[dependencies]
sabi-core = { path = "../sabi-core" }

tokio = { version = "1", features = ["full", "macros"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.7.0", features = ["serde", "v7"] }
serde_json = "1.0"
clap = "4.5.40"
axum = { version = "0.8.4", features = ["ws"] }
futures = "0.3.31"
bytes = "1.11.0"

[[bin]]
name = "sabi-server"
path = "src/bin/server.rs"
