[package]
name = "sabi-server"
version = "0.1.0"
edition = "2024"

[dependencies]
sabi-core = { path = "../sabi-core" }
sabi-storage = { path = "../sabi-storage" }
sabi-sql = { path = "../sabi-sql" } 
sabi-runtime = { path = "../sabi-runtime" }

tokio = { version = "1", features = ["full", "macros"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.7.0", features = ["serde", "v7", "v4"] }
serde_json = "1.0"
clap = { version = "4.5.40", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
axum = { version = "0.8.4", features = ["ws"] }
futures = "0.3.31"
bytes = "1.11.0"
tower-http = { version = "0.6.8", features = ["trace"] }

[[bin]]
name = "sabi-server"
path = "src/bin/server.rs"
