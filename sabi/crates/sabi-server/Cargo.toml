[package]
name = "sabi-server"
version = "0.1.0"
edition = "2024"

[dependencies]
sabi-core = { path = "../sabi-core" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.7.0", features = ["serde", "v7"] }
serde_json = "1.0"
clap = "4.5.54"
axum = "0.8.8"
tracing = "0.1.44"
